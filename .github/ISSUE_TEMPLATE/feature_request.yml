name: 💡 Feature Request
description: Suggest an idea or feature enhancement for remembrandt
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide details on the problem you want to solve or the capability you'd like added to remembrandt.

  - type: input
    id: summary
    attributes:
      label: Feature Title
      description: A short summary of your feature proposal.
      placeholder: e.g., 'Add JSON export command for memory entries'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: e.g., 'I am frustrated when I cannot filter recall by specific tags...'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Describe the feature
      description: Describe how you would like this feature to work.
      placeholder: Add a `--tag` flag to `remembrandt recall` to filter results by tag.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or design thoughts here.
