name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in remembrandt
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what the bug is.
      placeholder: e.g., 'remembrandt resume fails when category contains special characters'
    validations:
      required: true

  - type: dropdown
    id: environment_type
    attributes:
      label: Environment / Agent Context
      description: Where did you encounter this bug?
      options:
        - Claude Code
        - Cursor
        - Codex / OpenAI
        - CLI (Terminal directly)
        - Other AI Agent
    validations:
      required: true

  - type: input
    id: os_info
    attributes:
      label: Operating System & Python Version
      description: e.g., macOS Sonoma, Ubuntu 22.04, Windows 11 / Python 3.11.2
      placeholder: Windows 11, Python 3.10
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `remembrandt remember "Test entry" -c decision`
        2. Run `remembrandt recall`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior / Output Log
      description: Paste any error messages, terminal output, or logs here.
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the problem here.
